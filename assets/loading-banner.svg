<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-label="Asfak Rahman - Full Stack Developer loading animation">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="barClip"><rect x="60" y="196" width="780" height="10" rx="5"/></clipPath>
  </defs>

  <!-- background -->
  <rect width="900" height="260" rx="20" fill="url(#bg)"/>
  <circle cx="790" cy="40" r="120" fill="#818cf8" opacity="0.08">
    <animate attributeName="r" values="110;130;110" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="90" cy="230" r="90" fill="#22d3ee" opacity="0.07">
    <animate attributeName="r" values="90;105;90" dur="5s" repeatCount="indefinite"/>
  </circle>

  <!-- greeting -->
  <text x="60" y="95" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#94a3b8" font-weight="500">
    <animate attributeName="opacity" values="0;1" dur="0.6s" fill="freeze"/>
    Loading profile...
  </text>

  <!-- name with fade + slide in -->
  <text x="60" y="150" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="48" font-weight="800" fill="#f8fafc">
    <animate attributeName="opacity" values="0;1" dur="0.8s" begin="0.3s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" values="-20,0;0,0" dur="0.8s" begin="0.3s" fill="freeze"/>
    Hi, I'm Asfak Rahman
    <animate attributeName="fill" values="#f8fafc;#22d3ee;#f8fafc" dur="3s" begin="1.2s" repeatCount="indefinite"/>
  </text>

  <!-- role line -->
  <text x="60" y="185" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#cbd5e1">
    <animate attributeName="opacity" values="0;1" dur="0.8s" begin="0.8s" fill="freeze"/>
    Full Stack Developer · Java Developer · AI Enthusiast
  </text>

  <!-- progress bar track -->
  <rect x="60" y="196" width="780" height="10" rx="5" fill="#334155"/>
  <!-- filling bar -->
  <g clip-path="url(#barClip)">
    <rect x="60" y="196" width="0" height="10" fill="url(#accent)">
      <animate attributeName="width" values="0;780" dur="2.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1" keyTimes="0;1"/>
    </rect>
    <!-- shimmer sweeping across the track -->
    <rect x="60" y="196" width="160" height="10" fill="url(#shine)">
      <animate attributeName="x" values="-160;940" dur="1.6s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- bouncing dots -->
  <g transform="translate(60,226)">
    <circle cx="0" cy="0" r="5" fill="#22d3ee">
      <animate attributeName="cy" values="0;-8;0" dur="0.9s" begin="0s" repeatCount="indefinite"/>
    </circle>
    <circle cx="18" cy="0" r="5" fill="#818cf8">
      <animate attributeName="cy" values="0;-8;0" dur="0.9s" begin="0.15s" repeatCount="indefinite"/>
    </circle>
    <circle cx="36" cy="0" r="5" fill="#f472b6">
      <animate attributeName="cy" values="0;-8;0" dur="0.9s" begin="0.3s" repeatCount="indefinite"/>
    </circle>
    <text x="60" y="5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#64748b">Code. Learn. Build. Repeat.</text>
  </g>

  <!-- spinning ring top-right -->
  <g transform="translate(800,60)">
    <circle r="28" fill="none" stroke="#334155" stroke-width="5"/>
    <circle r="28" fill="none" stroke="url(#accent)" stroke-width="5" stroke-linecap="round" stroke-dasharray="60 200">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.2s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
